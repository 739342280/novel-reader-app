name: Build Flet Android APK and Windows

on:
  push:
    branches: [ master ]
    tags: 
      - 'v*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:          

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" 
  APP_VERSION: "" 

jobs:
  # =========================================================
  # 任务 1：极速占位（只需5秒，提前建好 Release 页面供后续任务上传）
  # =========================================================
  prepare-release:
    name: Prepare Release Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract Version
        run: |
          VERSION=$(grep 'self\.version' main.py | head -n 1 | sed 's/[^"]*"\([^"]*\)".*/\1/')
          if [ -z "$VERSION" ]; then VERSION="Unknown"; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Empty Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 小说智读 v${{ env.APP_VERSION }}
          body: "小说智读 v${{ env.APP_VERSION }} 自动构建发布。"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # 任务 2：安卓端独立构建（慢任务，完成后独立上架）
  # =========================================================
  build-android:
    name: Build Android APK
    needs: prepare-release    # 等待空页面建好就起跑
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "0.0.0"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract Version
      run: |
        VERSION=$(grep 'self\.version' main.py | head -n 1 | sed 's/[^"]*"\([^"]*\)".*/\1/')
        if [ -z "$VERSION" ]; then VERSION="Unknown"; fi
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' 
    
    - name: Install dependencies
      run: |
        pip install flet==0.84.0
        pip install -r requirements.txt || echo "No requirements.txt"

    - name: Cache Flet templates
      uses: actions/cache@v4
      with:
        path: ~/.flet
        key: ${{ runner.os }}-flet-0.84.0
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;27.0.12077973" --channel=0
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.4'  
        channel: 'stable'
        cache: "false" 
    
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/release.keystore
    
    - name: Build Flet APK
      run: |
        export SERIOUS_PYTHON_SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
        flet build apk --product "小说智读" --build-version "${{ env.APP_VERSION }}" --build-number ${{ github.run_number }} --org "com.shoubeier" --split-per-abi --android-signing-key-store $GITHUB_WORKSPACE/release.keystore --android-signing-key-alias novelkey --android-signing-key-store-password novel2026 --android-signing-key-password novel2026
    
    - name: Rename APKs
      run: |
        shopt -s nullglob
        for file in build/apk/*.apk build/app/outputs/flutter-apk/*-release.apk; do
          abi=$(echo "$file" | grep -oE '(arm64-v8a|armeabi-v7a|x86_64)')
          if [ -n "$abi" ]; then
            mv "$file" "小说智读_v${{ env.APP_VERSION }}_${abi}.apk"
          fi
        done
        
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      with:
        name: 小说智读_v${{ env.APP_VERSION }}_arm64-v8a.apk
        path: 小说智读_v*arm64-v8a.apk
        if-no-files-found: warn
        archive: false

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      with:
        name: 小说智读_v${{ env.APP_VERSION }}_armeabi-v7a.apk
        path: 小说智读_v*armeabi-v7a.apk
        if-no-files-found: warn
        archive: false

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      with:
        name: 小说智读_v${{ env.APP_VERSION }}_x86_64.apk
        path: 小说智读_v*x86_64.apk
        if-no-files-found: warn
        archive: false

    # 【核心修改点】：弃用会吞掉中文名字的 softprops 插件，换用官方 gh cli 进行推流
    - name: Publish APKs to Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        shopt -s nullglob
        for file in 小说智读_v*.apk; do
          gh release upload "${{ github.ref_name }}" "$file" --clobber
        done


  # =========================================================
  # 任务 3：Windows 独立构建（快任务，完成后率先上架！）
  # =========================================================
  build-windows:
    name: Build Windows EXE
    needs: prepare-release    # 同样只等待空页面建好就起跑
    runs-on: windows-latest
    env:
      APP_VERSION: "0.0.0"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract Version
      shell: bash 
      run: |
        VERSION=$(grep 'self\.version' main.py | head -n 1 | sed 's/[^"]*"\([^"]*\)".*/\1/')
        if [ -z "$VERSION" ]; then VERSION="Unknown"; fi
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
        cache: 'pip' 
    
    - name: Install dependencies
      shell: bash
      run: |
        pip install flet==0.84.0 flet-desktop==0.84.0 pyinstaller
        pip install -r requirements.txt || echo "No requirements.txt"

    - name: Build Windows App Directory (PyInstaller Engine)
      shell: bash
      env:
        PYTHONUTF8: "1"  
      run: |
        rm -rf dist build
        pyinstaller --noconsole --windowed --onedir --name "小说智读" --collect-all flet --collect-all flet_desktop main.py
        
        if [ -d "assets" ]; then cp -R assets dist/小说智读/; fi
        if [ -d "fonts" ]; then cp -R fonts dist/小说智读/; fi
        if [ -d "images" ]; then cp -R images dist/小说智读/; fi
        
    - name: Build Installer Setup
      shell: pwsh
      run: |
        $iss = Get-Content installer_script.iss
        $iss = $iss -replace 'AppVersion=.*', "AppVersion=${env:APP_VERSION}"
        $iss = $iss -replace 'OutputBaseFilename=.*', "OutputBaseFilename=小说智读_v${env:APP_VERSION}_安装版"
        $iss | Set-Content installer_script.iss
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_script.iss
        
    - name: Build Portable EXE
      shell: bash
      env:
        PYTHONUTF8: "1"
      run: |
        mv dist dist_folder_backup
        mkdir dist
        rm -rf build
        
        PACK_CMD="flet pack main.py --name \"小说智读_v${{ env.APP_VERSION }}_便携版\" --product-name \"小说智读\" --product-version \"${{ env.APP_VERSION }}\""
        
        if [ -d "assets" ]; then PACK_CMD="$PACK_CMD --add-data \"assets;assets\""; fi
        if [ -d "fonts" ]; then PACK_CMD="$PACK_CMD --add-data \"fonts;fonts\""; fi
        if [ -d "images" ]; then PACK_CMD="$PACK_CMD --add-data \"images;images\""; fi
        
        eval $PACK_CMD

    - name: Upload Portable EXE
      uses: actions/upload-artifact@v7
      with:
        name: 小说智读_v${{ env.APP_VERSION }}_便携版.exe
        path: dist/小说智读_v*_便携版.exe
        if-no-files-found: warn
        archive: false

    - name: Upload Installer EXE
      uses: actions/upload-artifact@v7
      with:
        name: 小说智读_v${{ env.APP_VERSION }}_安装版.exe
        path: dist_installer/小说智读_v*_安装版.exe
        if-no-files-found: warn
        archive: false

    # 【核心修改点】：放弃软弱且吞中文的 softprops 插件，借助 powershell (pwsh) 原生 UTF-8 能力推流
    - name: Publish Portable EXE to Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $portable = Get-ChildItem -Path dist -Filter "小说智读_v*_便携版.exe" | Select-Object -First 1
        if ($portable) {
            gh release upload "${env:GITHUB_REF_NAME}" $portable.FullName --clobber
        }

    - name: Publish Installer EXE to Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $installer = Get-ChildItem -Path dist_installer -Filter "小说智读_v*_安装版.exe" | Select-Object -First 1
        if ($installer) {
            gh release upload "${env:GITHUB_REF_NAME}" $installer.FullName --clobber
        }