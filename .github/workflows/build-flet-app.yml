name: Build Flet Android APK and Windows

on:
  push:
    branches: [ master, vulkan ]
    tags: 
      - 'v*'
  pull_request:
    branches: [ master, vulkan ]
  workflow_dispatch:          

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" 
  APP_VERSION: "" 

jobs:
  # =========================================================
  # 任务 1：极速占位（只需5秒，提前建好 Release 页面供后续任务上传）
  # =========================================================
  prepare-release:
    name: Prepare Release Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract Version
        run: |
          VERSION=$(grep 'self\.version' main.py | head -n 1 | sed 's/[^"]*"\([^"]*\)".*/\1/')
          if [ -z "$VERSION" ]; then VERSION="Unknown"; fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Empty Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 小说智读 v${{ env.APP_VERSION }}
          body: "小说智读 v${{ env.APP_VERSION }} 自动构建发布。"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # 任务 2：安卓端独立构建 (官方 .so 优雅偷渡版)
  # =========================================================
  build-android:
    name: Build Android APK
    needs: prepare-release    
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "0.0.0"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract Version
      run: |
        VERSION=$(grep 'self\.version' main.py | head -n 1 | sed 's/[^"]*"\([^"]*\)".*/\1/')
        if [ -z "$VERSION" ]; then VERSION="Unknown"; fi
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' 

    # 💥 战术剥离：防止 pip 尝试在安卓环境下编译 C++
    - name: Patch requirements for Android
      run: |
        if [ -f "requirements.txt" ]; then
          sed -i '/sqlite-vec/d' requirements.txt
        fi
    
    - name: Install dependencies
      run: |
        pip install flet==0.84.0
        pip install -r requirements.txt || echo "No requirements.txt"

    # 💥 步骤 A：下载官方 sqlite-vec Android 动态库 (修复下载与环境错位)
    - name: Download Official sqlite-vec Android Binary
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Downloading official sqlite-vec for Android..."
        # 1. 注入 GitHub Token，防止 API 被限流导致拿不到地址
        ASSET_URL=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/asg017/sqlite-vec/releases/latest | grep "browser_download_url" | grep "android" | grep -E "aarch64|arm64" | cut -d '"' -f 4 | head -n 1)
        
        # 2. 修复 Fallback 链接中多余的 'v' 字符 (0.1.9 而不是 v0.1.9)
        if [ -z "$ASSET_URL" ]; then
          echo "Warning: API fetch failed, using fallback URL."
          ASSET_URL="https://github.com/asg017/sqlite-vec/releases/download/v0.1.9/sqlite-vec-0.1.9-loadable-android-aarch64.tar.gz"
        fi
        
        echo "Downloading from: $ASSET_URL"
        wget -qO sqlite-vec-android.tar.gz "$ASSET_URL"
        
        # 建立合法的待注入原生目录
        mkdir -p android_native_libs/lib/arm64-v8a
        tar -xzf sqlite-vec-android.tar.gz
        find . -name "*.so" -exec mv {} android_native_libs/lib/arm64-v8a/libsqlite_vec.so \;
        echo "✅ sqlite-vec 已就绪"

    # 💥 步骤 B（终极重制版）：检出源码并静态熔炼单体 libllama.so
    - name: Checkout llama.cpp source
      uses: actions/checkout@v4
      with:
        repository: ggerganov/llama.cpp
        path: llama.cpp-src

    # 💥 1. 拉取 Khronos 官方纯净版 OpenCL 头文件
    - name: Fetch OpenCL Headers
      run: |
        echo "🚀 获取 Khronos 官方 OpenCL 头文件..."
        git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-headers
        
        # 💥 暴力植入 1：直接把 OpenCL 头文件扔进系统的标准 include 目录
        sudo cp -r opencl-headers/CL /usr/include/
        
        # 💥 暴力植入 2：为了防止 NDK 交叉编译工具链不认系统目录，再扔一份到工具链的标准目录里！
        sudo cp -r opencl-headers/CL $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/

    # 💥 2. 编译 OpenCL 版的单体 libllama.so
    - name: Build Monolithic libllama.so (OpenCL)
      run: |
        echo "🚀 开始静态熔炼 llama.cpp (OpenCL版)..."
        cd llama.cpp-src
        
        mkdir build && cd build
        
        # 💥 核心补丁：我上次漏掉了这极其关键的一行！
        # -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,undefs -Wl,--unresolved-symbols=ignore-all"
        # 强行命令安卓的 NDK 链接器：闭嘴，忽略所有未定义的 OpenCL 函数，立刻打包！
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-28 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DGGML_OPENMP=OFF \
          -DGGML_BACKEND_DL=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_SERVER=OFF \
          -DGGML_OPENCL=ON \
          -DOpenCL_LIBRARY="dl" \
          -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,undefs -Wl,--unresolved-symbols=ignore-all"
        
        # 4 线程全速编译
        make -j4
        
        mkdir -p ../../android_native_libs/lib/arm64-v8a
        find . -name "libggml-base.so" -exec cp -L {} ../../android_native_libs/lib/arm64-v8a/ \;
        find . -name "libggml.so" -exec cp -L {} ../../android_native_libs/lib/arm64-v8a/ \;
        find . -name "libggml-cpu.so" -exec cp -L {} ../../android_native_libs/lib/arm64-v8a/ \; 
        # 💥 提取编译出的 OpenCL 动态库
        find . -name "libggml-opencl.so" -exec cp -L {} ../../android_native_libs/lib/arm64-v8a/ \;
        find . -name "libllama.so" -exec cp -L {} ../../android_native_libs/lib/arm64-v8a/ \;
        
        cd ../..
        rm -rf llama.cpp-src
        echo "✅ OpenCL 版静态单体 libllama.so 编译就绪！"
        
    - name: Cache Flet templates
      uses: actions/cache@v4
      with:
        path: ~/.flet
        key: ${{ runner.os }}-flet-0.84.0
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.4'  
        channel: 'stable'
        cache: "false" 
    
    - name: Decode Keystore
      run: |
        # 💥 瘦身手术 3：把签名证书放到工作区之外的 /tmp 目录，防止被 Flet 打包进去
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
    
    - name: Build Flet APK
      run: |
        export SERIOUS_PYTHON_SITE_PACKAGES="$(python -c 'import site; print(site.getsitepackages()[0])')"
        
        # 💥 瘦身绝杀 1：把 .git 移到上一级目录藏起来，完美躲避 Flet 的打包雷达
        mv .git ../.git_backup
        
        # 💥 瘦身绝杀 2：顺手干掉其他对手机毫无用处的开发文档
        rm -rf .github README.md installer_script.iss requirements.txt
        
        # 正常执行打包命令
        flet build apk --product "小说智读" --build-version "${{ env.APP_VERSION }}" --build-number ${{ github.run_number }} --org "com.shoubeier" --split-per-abi --android-signing-key-store /tmp/release.keystore --android-signing-key-alias novelkey --android-signing-key-store-password novel2026 --android-signing-key-password novel2026
        
        # 💥 打包完成后：把 .git 移回原位，保证后续的 Github Release 上传不报错
        mv ../.git_backup .git
    
    # 💥 新增绝杀步骤：强行开壳注入原生库，并重新签名
    - name: Inject Native Libs and Re-sign APK
      run: |
        echo "寻找 Android Build Tools..."
        BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
        export PATH="$PATH:$BUILD_TOOLS"
        
        shopt -s nullglob
        for apk in build/apk/*arm64-v8a*.apk build/app/outputs/flutter-apk/*arm64-v8a*.apk; do
          echo "💉 正在注入底层动态库到: $apk"
          
          # 1. 将上面准备好的 lib 文件夹，直接塞进 APK 的外壳中
          cd android_native_libs
          zip -ur "../$apk" lib/
          cd ..
          
          # 2. 重新 Zipalign 对齐 (安卓安装的硬性规范)
          zipalign -f -p 4 "$apk" "aligned_app.apk"
          mv "aligned_app.apk" "$apk"
          
          # 3. 使用你的 Keystore 重新盖章签名
          apksigner sign --ks /tmp/release.keystore --ks-pass pass:novel2026 --key-pass pass:novel2026 --ks-key-alias novelkey "$apk"
          echo "✅ 注入并重新签名成功！"
        done

    - name: Rename APKs
      run: |
        shopt -s nullglob
        for file in build/apk/*.apk build/app/outputs/flutter-apk/*-release.apk; do
          abi=$(echo "$file" | grep -oE '(arm64-v8a|armeabi-v7a|x86_64)')
          if [ -n "$abi" ]; then
            mv "$file" "NovelReader_v${{ env.APP_VERSION }}_${abi}.apk"
          fi
        done
        
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      with:
        name: NovelReader_v${{ env.APP_VERSION }}_arm64-v8a.apk
        path: NovelReader_v*arm64-v8a.apk
        if-no-files-found: warn
        archive: false

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      with:
        name: NovelReader_v${{ env.APP_VERSION }}_armeabi-v7a.apk
        path: NovelReader_v*armeabi-v7a.apk
        if-no-files-found: warn
        archive: false

    - name: Publish APKs to Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        shopt -s nullglob
        for file in NovelReader_v*.apk; do
          gh release upload "${{ github.ref_name }}" "$file" --clobber
        done

  # =========================================================
  # 任务 3：Windows 独立构建
  # =========================================================
  build-windows:
    name: Build Windows EXE
    needs: prepare-release    
    runs-on: windows-latest
    env:
      APP_VERSION: "0.0.0"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract Version
      shell: bash 
      run: |
        VERSION=$(grep 'self\.version' main.py | head -n 1 | sed 's/[^"]*"\([^"]*\)".*/\1/')
        if [ -z "$VERSION" ]; then VERSION="Unknown"; fi
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' 
        cache: 'pip' 
    
    - name: Install dependencies
      shell: bash
      run: |
        pip install flet==0.84.0 flet-desktop==0.84.0 pyinstaller Pillow
        pip install -r requirements.txt || echo "No requirements.txt"
    
    # 💥 插入这一个核心步骤：从你自己的 Release 中下载并解压巨大依赖库
    - name: Download Huge CUDA Dependencies
      shell: bash
      run: |
        echo "正在从云端拉取 Windows 底层依赖库..."
        # 替换为你刚才复制的真实 zip 下载链接
        curl -L -o cuda_deps.zip "https://github.com/739342280/novel-reader-app/releases/download/dependencies/windows-cuda-deps.zip"
        
        # 解压到 assets 文件夹中（如果压缩包里有层级，注意解压路径匹配）
        mkdir -p assets
        unzip -o cuda_deps.zip -d assets/
        
        # 阅后即焚，清理战场
        rm cuda_deps.zip
        echo "✅ 底层依赖已就绪！"

    - name: Build Windows App Directory (PyInstaller Engine)
      shell: bash
      env:
        PYTHONUTF8: "1"  
      run: |
        rm -rf dist build
        pyinstaller --noconsole --windowed --onedir --name "小说智读" --icon "assets/icon.ico" --collect-all flet --collect-all flet_desktop main.py
        
        if [ -d "assets" ]; then cp -R assets dist/小说智读/; fi
        if [ -d "fonts" ]; then cp -R fonts dist/小说智读/; fi
        if [ -d "images" ]; then cp -R images dist/小说智读/; fi
        
    # 💥 新增步骤：先打包包含所有 CUDA DLL 的【完整安装版】
    - name: Build Full Installer Setup
      shell: pwsh
      run: |
        $iss = Get-Content installer_script.iss
        $iss = $iss -replace 'AppVersion=.*', "AppVersion=${env:APP_VERSION}"
        $iss = $iss -replace 'OutputBaseFilename=.*', "OutputBaseFilename=NovelReader_v${env:APP_VERSION}_Full_Installer"
        $iss | Set-Content installer_script.iss
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_script.iss
        
    # 💥 核心战术：过河拆桥！删掉庞大的 CUDA 依赖，进行环境瘦身
    - name: Strip CUDA Dependencies for Lite & Portable
      shell: bash
      run: |
        echo "🗑️ 正在删除庞大的 CUDA DLL 文件..."
        # 1. 掏空 dist 目录里的 dll（为了接下来打包轻量版安装包）
        rm -f dist/小说智读/assets/*.dll
        # 2. 掏空根目录 assets 里的 dll（为了接下来打包便携版单文件）
        rm -f assets/*.dll
        echo "✅ 环境瘦身彻底完成！"

    # 💥 新增步骤：拿着已经被掏空的 dist 目录，再调用一次 Inno Setup 打包【轻量安装版】
    - name: Build Lite Installer Setup
      shell: pwsh
      run: |
        $iss = Get-Content installer_script.iss
        $iss = $iss -replace 'OutputBaseFilename=.*', "OutputBaseFilename=NovelReader_v${env:APP_VERSION}_Lite_Installer"
        $iss | Set-Content installer_script.iss
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_script.iss

    # 💥 终极步骤：拿着已经被掏空的 assets 目录，打包【便携单文件版】
    - name: Build Portable EXE
      shell: bash
      env:
        PYTHONUTF8: "1"
      run: |
        # 将刚才的 onedir 完整目录移走备份，腾出 dist 文件夹给 flet pack 使用
        mv dist dist_onedir_backup
        mkdir dist
        rm -rf build
        
        PACK_CMD="flet pack main.py --name \"NovelReader_v${{ env.APP_VERSION }}_Portable\" --icon \"assets/icon.ico\" --product-name \"小说智读\" --product-version \"${{ env.APP_VERSION }}\""
        
        if [ -d "assets" ]; then PACK_CMD="$PACK_CMD --add-data \"assets;assets\""; fi
        if [ -d "fonts" ]; then PACK_CMD="$PACK_CMD --add-data \"fonts;fonts\""; fi
        if [ -d "images" ]; then PACK_CMD="$PACK_CMD --add-data \"images;images\""; fi
        
        eval $PACK_CMD

    # ==========================================
    # 统一上传 Artifacts (三大护法)
    # ==========================================
    - name: Upload Portable EXE
      uses: actions/upload-artifact@v7
      with:
        name: NovelReader_v${{ env.APP_VERSION }}_Portable.exe
        path: dist/NovelReader_v*_Portable.exe
        if-no-files-found: warn
        archive: false

    - name: Upload Full Installer EXE
      uses: actions/upload-artifact@v7
      with:
        name: NovelReader_v${{ env.APP_VERSION }}_Full_Installer.exe
        path: dist_installer/NovelReader_v*_Full_Installer.exe
        if-no-files-found: warn
        archive: false

    - name: Upload Lite Installer EXE
      uses: actions/upload-artifact@v7
      with:
        name: NovelReader_v${{ env.APP_VERSION }}_Lite_Installer.exe
        path: dist_installer/NovelReader_v*_Lite_Installer.exe
        if-no-files-found: warn
        archive: false

    # ==========================================
    # 统一发布到 Release (代码极度精简版)
    # ==========================================
    - name: Publish All EXEs to Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        echo "🚀 正在将三个版本的 Windows 核心推送到 Release 页面..."
        shopt -s nullglob
        for file in dist/NovelReader_v*_Portable.exe dist_installer/NovelReader_v*.exe; do
          gh release upload "${{ github.ref_name }}" "$file" --clobber
        done